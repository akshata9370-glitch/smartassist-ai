server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: example-service
              uri: lb://EXAMPLE-SERVICE
              predicates:
                - Path=/api/example/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/